name: kikoe_desktop
description: "Kikoe desktop app: free, unlimited, offline audio/video transcription."
publish_to: 'none'
version: 2.3.1+16

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.2.0
  path: ^1.9.1
  desktop_drop: ^0.7.0
  ffi: ^2.1.4
  path_provider: ^2.1.5          # BSD-3
  shared_preferences: ^2.3.4     # BSD-3
  http: ^1.4.0                   # BSD-3, version display and update check
  url_launcher: ^6.3.3           # BSD-3, opens external links (GitHub, sponsors)
  package_info_plus: ^9.0.1      # BSD-3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
