name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $candidates = @("build/kikoe", "build/Release/kikoe.exe", "build/kikoe.exe", "build/Release/kikoe")
          $bin = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bin) { throw "kikoe binary not found in build output" }
          & $bin --help

  desktop:
    name: Build desktop (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build FFI library
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test
        working-directory: desktop
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Windows app
        working-directory: desktop
        run: flutter build windows --release

      - name: Bundle FFI library
        shell: pwsh
        run: |
          $bundle = "desktop/build/windows/x64/runner/Release"
          Copy-Item "build/Release/kikoe_ffi.dll" $bundle
          Compress-Archive -Path "$bundle/*" -DestinationPath "kikoe-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kikoe-windows-x64
          path: kikoe-windows-x64.zip
          retention-days: 14

  mobile:
    name: Build Android APK (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android NDK
        run: |
          echo y | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build FFI libraries for both ABIs
        run: |
          for abi in arm64-v8a x86_64; do
            cmake -S . -B "build-android-$abi" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
              -DKIKOE_BUILD_CLI=OFF -DKIKOE_BUILD_TESTS=OFF -DKIKOE_BUILD_FFI=ON \
              -DGGML_OPENMP=OFF -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-android-$abi" --target kikoe-ffi
            mkdir -p "mobile/android/app/src/main/jniLibs/$abi"
            cp "build-android-$abi/libkikoe_ffi.so" "mobile/android/app/src/main/jniLibs/$abi/"
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build release APKs
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kikoe-android-apks
          path: mobile/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
