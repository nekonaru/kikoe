<svg fill="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><title>Kikoe</title>
  <!-- Kikoe symbol: torii gate with an ear inside. White on transparent. -->
  <g fill="#000000">
    <!-- torii top beam -->
    <rect x="54" y="76" width="148" height="16" rx="8"/>
    <!-- torii pillars -->
    <rect x="66" y="88" width="15" height="88" rx="7.5"/>
    <rect x="175" y="88" width="15" height="88" rx="7.5"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <!-- ear: outer curve -->
    <path d="M 100 122 C 106 102, 138 99, 146 124 C 152 145, 138 156, 120 166"/>
    <!-- ear: inner curve -->
    <path d="M 104 132 C 112 118, 132 118, 136 134 C 139 147, 128 153, 117 152"/>
    <!-- ear: innermost mark -->
    <path d="M 109 134 C 114 129, 124 130, 125 138 C 126 143, 121 146, 116 144"/>
  </g>
</svg>
